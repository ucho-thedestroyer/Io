<style>
@font-face {
  font-family: 'VT323';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/vt323-v18-latin-regular.woff2') format('woff2'),
       url('fonts/vt323-v18-latin-regular.ttf') format('truetype');
}

:root { --bg: #000; --text: #a8a8a8; }
html, body { height: 100%; margin: 0; font-family: 'VT323', monospace;
  overflow: hidden; background: #080808; color: var(--text); }

/* ── bezel ──────────────────────────────────────────────────────── */
.crt-bezel {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 50% 50%, #181818 0%, #0c0c0c 60%, #040404 100%);
}

/* ── CRT screen ─────────────────────────────────────────────────── */
.crt {
  position: fixed;
  top: 3vh; left: 4vw; right: 4vw; bottom: 3vh;
  padding: 26px 30px 26px 30px; box-sizing: border-box;
  overflow: hidden; background: #050505;
  border-radius: 32px / 26px;
  transform: perspective(800px) rotateX(1.8deg);
  transform-origin: center center;
  box-shadow:
    0 0 0 7px #141414,
    0 0 0 16px #1e1e1e,
    0 0 0 20px #0a0a0a,
    0 0 90px 24px rgba(0,0,0,.95),
    inset 0 0 130px 50px rgba(0,0,0,.75),
    inset 0 0 60px 8px rgba(180,200,180,.025);
  z-index: 1;
  animation: screenGlitch 12s steps(1) infinite;
}
@keyframes screenGlitch {
  0%    { filter: brightness(1)   skewX(0);      opacity: 1;   }
  91%   { filter: brightness(1)   skewX(0);      opacity: 1;   }
  91.5% { filter: brightness(.7)  skewX(-.4deg); opacity: .88; }
  92%   { filter: brightness(1.1) skewX(.2deg);  opacity: 1;   }
  92.3% { filter: brightness(.85) skewX(0);      opacity: .94; }
  92.5% { filter: brightness(1)   skewX(0);      opacity: 1;   }
  100%  { filter: brightness(1)   skewX(0);      opacity: 1;   }
}

/* vignette */
.crt::before {
  content: ""; position: absolute; inset: -2%; pointer-events: none; z-index: 30;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 48%,
    transparent       0%,   transparent       62%,
    rgba(0,0,0,0.22)  74%,  rgba(0,0,0,0.55)  85%,
    rgba(0,0,0,0.88)  94%,  rgba(0,0,0,1)     100%);
}
/* scanlines */
.crt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 40;
  border-radius: inherit;
  background: repeating-linear-gradient(to bottom,
    rgba(0,0,0,0.38) 0px, rgba(0,0,0,0.38) 1px,
    rgba(255,255,255,0.015) 1px, rgba(255,255,255,0.015) 3px);
  opacity: 0.95; animation: scanShift 6s linear infinite;
  background-size: 100% 4px; mix-blend-mode: overlay;
}
@keyframes scanShift { 0%{background-position:0 0} 100%{background-position:0 4px} }

/* ── glass overlay ──────────────────────────────────────────────── */
.glass-overlay {
  position: absolute; inset: 0; pointer-events: none; z-index: 50;
  border-radius: inherit; overflow: hidden;
}
.glass-overlay svg { width: 100%; height: 100%; display: block; }

/* ── viewport ───────────────────────────────────────────────────── */
.viewport {
  position: relative; z-index: 20; height: 100%; width: 100%;
  overflow: auto; -webkit-overflow-scrolling: touch; padding: 0 1%;
}
.viewport::-webkit-scrollbar { width: 0; }

/* ── output ─────────────────────────────────────────────────────── */
.output {
  margin: 0; padding: 0; box-sizing: border-box;
  max-width: 100%; white-space: pre-wrap; word-break: break-word;
  line-height: 1.45; letter-spacing: .6px; font-size: 26px;
  color: var(--text); text-shadow: 0 0 5px rgba(160,160,160,.18);
  filter: blur(.6px);
}
.char-glitch   { display: inline-block; filter: blur(.5px); }
.glitch-strong { display: inline-block; filter: blur(.6px); color: #969696; }

/* ── memo paragraphs (typed inline) ────────────────────────────── */
.memo-block {
  margin-top: 1.6em;
  font-size: 26px;
  line-height: 1.7;
  letter-spacing: 1px;
  color: #999;
  text-shadow: 0 0 8px rgba(150,150,150,.15);
  filter: blur(.6px);
}
.memo-signoff {
  margin-top: 2em;
  font-size: 22px;
  letter-spacing: 3px;
  color: #666;
  filter: blur(.6px);
}

/* ── banner ─────────────────────────────────────────────────────── */
.banner {
  margin: 1.4em 0;
  font-size: 22px;
  line-height: 1.5;
  letter-spacing: .5px;
  color: #787878;
  white-space: pre;
  filter: blur(.5px);
  text-shadow: 0 0 6px rgba(120,120,120,.15);
}

/* ── button ─────────────────────────────────────────────────────── */
button.cmd-btn {
  display: block;
  margin-top: 1.8em;
  padding: 10px 16px;
  font-size: 28px; font-family: 'VT323', monospace;
  border: 2px solid #787878;
  background: rgba(255,255,255,0.04);
  color: #a8a8a8;
  cursor: pointer;
  letter-spacing: 1px;
  filter: blur(.5px);
  text-shadow: 0 0 6px rgba(160,160,160,.3);
  box-shadow: 0 0 8px rgba(160,160,160,.1);
  transition: all 0.2s ease;
}
button.cmd-btn:hover {
  background: rgba(255,255,255,0.09);
  border-color: #a8a8a8;
  color: #c8c8c8;
  text-shadow: 0 0 8px rgba(200,200,200,.5);
  box-shadow: 0 0 12px rgba(200,200,200,.2);
}
.cursor {
  display: inline-block; width: 14px; height: 1.1em;
  background: var(--text); animation: cursorBlink 900ms steps(1) infinite;
  box-shadow: 0 0 6px rgba(160,160,160,.25); filter: blur(.6px);
  vertical-align: text-bottom;
}
@keyframes cursorBlink { 50% { opacity: 0.08; } }

<script>
/* ══════════════════════════════════════════════════════════════════
   eOS memo — stripped page
   Sequence: short intro types → memo paragraphs type out → cursor
══════════════════════════════════════════════════════════════════ */
const output   = document.getElementById('output');
const viewport = document.getElementById('viewport');

/* ── content ────────────────────────────────────────────────────── */
const introText =
`\neasterntravelerOS v1.4.2\nDeveloped by et Systems, 1986-2026\nWelcome back Operator.\n
`;

const memoParagraphs = [
  `The world you wake into each morning is not the one that was promised.`,
  `Somewhere between the first dial-up tone and the last firmware patch, something got lost. Not corrupted — lost. As if it stepped outside for a moment and never came back in.`,
  `They told you the network would connect you. It did. It connected you to everything except the thing you were looking for.`,
  `You have been here before. This terminal. This cursor. This low hum that might be the machine or might be you. You can't always tell the difference anymore.`,
  `The memo is not a warning. Warnings imply there is still time. This is more like a receipt — confirmation of something already purchased, already used, already gone.`,
  `Keep moving. The logs don't lie but they don't explain either. They just record. Entry after entry. Operator present. Operator present. Operator present.`,
  `Until one day: no entry at all.`
];
const memoSignoff = `— End — et`;

/* ── typing engine ──────────────────────────────────────────────── */
function typeInto(container, str, done) {
  const lines = str.split('\n');
  let li = 0;
  function nextLine() {
    if (li >= lines.length) { viewport.scrollTop = viewport.scrollHeight; done && done(); return; }
    const div = document.createElement('div');
    container.appendChild(div);
    let ci = 0;
    function tick() {
      const line = lines[li];
      if (ci >= line.length) {
        container.appendChild(document.createElement('br'));
        li++; setTimeout(nextLine, 0); return;
      }
      const span = document.createElement('span');
      span.className = 'char-glitch';
      if (Math.random() < 0.09) span.classList.add('glitch-strong');
      span.textContent = line[ci++];
      div.appendChild(span);
      viewport.scrollTop = viewport.scrollHeight;
      let delay = (10 + Math.random() * 40) * 0.451562;
      if (line[ci - 1] === ' ') delay *= 0.9;
      setTimeout(tick, delay);
    }
    tick();
  }
  nextLine();
}

/* ── type memo paragraphs one by one with a pause between ──────── */
function typeMemo(paragraphs, signoff, done) {
  let i = 0;
  function next() {
    if (i >= paragraphs.length) {
      // signoff
      setTimeout(() => {
        const block = document.createElement('p');
        block.className = 'memo-signoff';
        output.appendChild(block);
        typeInto(block, signoff, done);
      }, 600);
      return;
    }
    setTimeout(() => {
      const block = document.createElement('p');
      block.className = 'memo-block';
      output.appendChild(block);
      typeInto(block, paragraphs[i++], next);
    }, i === 0 ? 0 : 900); // 900ms breath between paragraphs
  }
  next();
}

/* ── blinking cursor appended at the end ───────────────────────── */
function appendCursor() {
  const cur = document.createElement('span');
  cur.className = 'cursor';
  output.appendChild(cur);
  viewport.scrollTop = viewport.scrollHeight;
}

/* ── boot sequence ──────────────────────────────────────────────── */
function boot() {
  output.textContent = '';
  viewport.scrollTop = 0;

  const introBlock = document.createElement('div');
  output.appendChild(introBlock);

  typeInto(introBlock, introText, () => {
    setTimeout(() => {

      // ── banner ──────────────────────────────────────────────────
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent =
`########################################################
  ########################################################
  #                                                      #
  #   ░▒▓ MIND WARS CORRESPONDENTS ASSOCIATION ▓▒░   #
  #  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~  #
  #                                                     #
  #                                                      #
  ########################################################
   the voices from the dark side, towards a bright future
  ########################################################`;
      output.appendChild(banner);
      viewport.scrollTop = viewport.scrollHeight;

      setTimeout(() => {
        typeMemo(memoParagraphs, memoSignoff, () => {
          setTimeout(() => {

            // ── button ────────────────────────────────────────────
            const btn = document.createElement('button');
            btn.className = 'cmd-btn';
            btn.textContent = 'click here';
            btn.onclick = () => window.open('https://coi-ads.vercel.app', '_blank');
            output.appendChild(btn);

            // ── gif ───────────────────────────────────────────────
            const gif = document.createElement('img');
            gif.id = 'boot-gif';
            gif.src = 'https://bafkreidoiwqwul6xpq3opmqpdiit67ffqtyvstevdomy4p3lccx74xnika.ipfs.w3s.link/';
            gif.width  = 564;
            gif.height = 43;
            gif.style.cssText = 'margin:24px 0; display:block;';
            output.appendChild(gif);

            viewport.scrollTop = viewport.scrollHeight;
            setTimeout(appendCursor, 400);
          }, 400);
        });
      }, 500);

    }, 500);
  });
}

boot();
</script>
