<style>
@font-face {
  font-family: 'VT323';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/vt323-v18-latin-regular.woff2') format('woff2'),
       url('fonts/vt323-v18-latin-regular.ttf') format('truetype');
}

:root { --bg: #000; --text: #a8a8a8; }
html, body { height: 100%; margin: 0; font-family: 'VT323', monospace; overflow: hidden; background: var(--bg); color: var(--text); }

/* ── CRT shell ─────────────────────────────────────────────────── */

body { background: #080808; }

.crt-bezel {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 50% 50%, #181818 0%, #0c0c0c 60%, #040404 100%);
}

.crt {
  position: fixed;
  top: 3vh; left: 4vw; right: 4vw; bottom: 3vh;
  padding: 26px 30px 70px 30px; box-sizing: border-box;
  overflow: hidden; background: #050505;
  border-radius: 32px / 26px;
  transform: perspective(800px) rotateX(1.8deg);
  transform-origin: center center;
  box-shadow:
    0 0 0 7px #141414,
    0 0 0 16px #1e1e1e,
    0 0 0 20px #0a0a0a,
    0 0 90px 24px rgba(0,0,0,.95),
    inset 0 0 130px 50px rgba(0,0,0,.75),
    inset 0 0 60px 8px rgba(180,200,180,.025);
  z-index: 1;
  animation: screenGlitch 12s steps(1) infinite;
}

@keyframes screenGlitch {
  0%    { filter: brightness(1)   skewX(0);      opacity: 1;    }
  91%   { filter: brightness(1)   skewX(0);      opacity: 1;    }
  91.3% { filter: brightness(.5)  skewX(-.8deg); opacity: .75;  }
  91.7% { filter: brightness(1.2) skewX(.4deg);  opacity: 1;    }
  92%   { filter: brightness(.7)  skewX(0);      opacity: .88;  }
  92.4% { filter: brightness(1)   skewX(0);      opacity: 1;    }
  100%  { filter: brightness(1)   skewX(0);      opacity: 1;    }
}

/* Strong curved vignette */
.crt::before {
  content: ""; position: absolute; inset: -2%; pointer-events: none; z-index: 30;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 48%,
    transparent          0%,
    transparent          62%,
    rgba(0,0,0,0.22)     74%,
    rgba(0,0,0,0.55)     85%,
    rgba(0,0,0,0.88)     94%,
    rgba(0,0,0,1)        100%);
}

/* scanlines */
.crt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 40;
  border-radius: inherit;
  background: repeating-linear-gradient(to bottom,
    rgba(0,0,0,0.38) 0px, rgba(0,0,0,0.38) 1px,
    rgba(255,255,255,0.015) 1px, rgba(255,255,255,0.015) 3px);
  opacity: 0.95; animation: scanShift 6s linear infinite;
  background-size: 100% 4px; mix-blend-mode: overlay;
}
@keyframes scanShift { 0%{background-position:0 0} 100%{background-position:0 4px} }

/* ── Glass reflection overlay ──────────────────────────────────── */
.glass-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 50;
  border-radius: inherit;
  overflow: hidden;
}
.glass-overlay svg {
  width: 100%; height: 100%;
  display: block;
}

/* ── viewport ──────────────────────────────────────────────────── */
.viewport {
  position: relative; z-index: 20; height: 100%; width: 100%;
  overflow: auto; -webkit-overflow-scrolling: touch;
  /* subtle barrel-hint: content slightly compressed at edges */
  padding: 0 1%;
}
.viewport::-webkit-scrollbar { width: 0; }

/* ── logo ──────────────────────────────────────────────────────── */
.logo {
  position: fixed; top: 30px; right: 74px;
  width: 110px; height: 110px;
  overflow: hidden;
  z-index: 999; margin: 0; float: none;
  filter: blur(.6px) brightness(.55) drop-shadow(0 0 6px rgba(160,160,160,.2)) grayscale(.4);
  opacity: 0.75;
}
.logo > a { display: block; width: 100%; height: 100%; }
.logo svg {
  display: block;
  width: 110px !important;
  height: 110px !important;
  max-width: 110px !important;
  max-height: 110px !important;
}

/* ── output text ───────────────────────────────────────────────── */
.output {
  margin: 0; padding: 0; box-sizing: border-box;
  max-width: 100%; white-space: pre-wrap; word-break: break-word;
  line-height: 1.45; letter-spacing: .6px; font-size: 26px;
  color: var(--text); text-shadow: 0 0 5px rgba(160,160,160,.18);
  filter: blur(.6px);
}

/* static output blocks */
.output-static {
  filter: blur(.6px);
  color: var(--text);
}

/* typed chars — same haze as static, no animation */
.char-glitch  { display: inline-block; filter: blur(.5px); }
.glitch-strong { display: inline-block; filter: blur(.6px); color: #969696; }

/* ── cmd line / cursor ─────────────────────────────────────────── */
.cmd-line { display: flex; align-items: flex-end; gap: 4px; font-size: 26px; }
.cursor {
  display: inline-block; width: 14px; height: 1.1em;
  background: var(--text); animation: cursorBlink 900ms steps(1) infinite;
  box-shadow: 0 0 6px rgba(160,160,160,.25); filter: blur(.6px); cursor: pointer;
}
@keyframes cursorBlink { 50% { opacity: 0.08; } }
.input-echo { display: inline; }

.cmd-input {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 30px; background: transparent; color: transparent;
  caret-color: transparent; font: inherit; border: none; outline: none;
}

/* ── BSOD ──────────────────────────────────────────────────────── */
.bsod {
  position: fixed; inset: 0; z-index: 9999; display: none;
  background: #0000aa; color: #ffffff; font-family: monospace;
  font-size: 22px; padding: 48px; line-height: 1.5; white-space: pre-wrap;
}

/* ── buttons ───────────────────────────────────────────────────── */
button.cmd-btn {
  padding: 10px 16px; font-size: 28px; font-family: 'VT323', monospace;
  border: 2px solid #f0f0f0; background: rgba(255,255,255,0.05);
  color: #ffffff; margin-top: 6px; cursor: pointer;
  text-shadow: 0 0 6px rgba(255,255,255,0.6), 0 0 12px rgba(255,255,255,0.3);
  box-shadow: 0 0 8px rgba(255,255,255,0.2); transition: all 0.2s ease;
}
button.cmd-btn:hover {
  background: rgba(255,255,255,0.12); border-color: #ffffff;
  text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 14px rgba(255,255,255,0.5);
  box-shadow: 0 0 12px rgba(255,255,255,0.4);
}

/* ── NET table ─────────────────────────────────────────────────── */
.net-table-wrap {
  margin-top: 14px;
  border: 2px solid #555;
  box-shadow: 0 0 14px rgba(200,200,200,.08), inset 0 0 30px rgba(0,0,0,.4);
  overflow: hidden;
  animation: tableFlicker 6s steps(1) infinite;
}
@keyframes tableFlicker {
  0%,100% { box-shadow: 0 0 14px rgba(200,200,200,.08), inset 0 0 30px rgba(0,0,0,.4); }
  22%     { box-shadow: 0 0 20px rgba(200,200,200,.14), inset 0 0 30px rgba(0,0,0,.4); }
  23%     { box-shadow: 0 0 14px rgba(200,200,200,.08), inset 0 0 30px rgba(0,0,0,.4); }
}
.net-table {
  width: 100%; border-collapse: collapse;
  font-size: 21px; font-family: 'VT323', monospace;
  filter: blur(.4px);
}
.net-table th {
  background: rgba(160,160,160,0.07);
  color: #a8a8a8;
  padding: 8px 14px;
  text-align: left;
  letter-spacing: 3px;
  font-size: 18px;
  border-bottom: 2px solid #333;
  text-transform: uppercase;
  text-shadow: 0 0 6px rgba(160,160,160,.2);
  filter: blur(.5px);
}
.net-table th:not(:last-child), .net-table td:not(:last-child) {
  border-right: 1px solid #222;
}
.net-table td {
  padding: 7px 14px;
  color: #888;
  border-bottom: 1px solid #1a1a1a;
  vertical-align: top;
  line-height: 1.35;
  filter: blur(.5px);
}
.net-table tr:hover td { background: rgba(255,255,255,0.02); }
.net-table .col-term    { color: #a0a0a0; font-size: 23px; white-space: nowrap; }
.net-table .col-def     { color: #787878; font-size: 20px; }
.net-table .col-cat     { color: #555; font-size: 18px; letter-spacing: 1px; white-space: nowrap; }

/* table row stagger-in */
.net-table tr.row-hidden { opacity: 0; transform: translateX(-8px); transition: none; }
.net-table tr.row-in     { opacity: 1; transform: translateX(0);
  transition: opacity .5s ease, transform .5s ease; }

@media (max-width: 640px) {
  .logo { width: 80px; height: 80px; right: 16px; top: 16px; }
  .output, .cmd-line { font-size: 20px; }
  .net-table { font-size: 16px; }
  .net-table .col-term { font-size: 18px; }
}
</style>

function createCmdLine() {
  const line   = document.createElement('div'); line.className = 'cmd-line';
  const echo   = document.createElement('span'); echo.className = 'input-echo'; echo.textContent = '> ';
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  cursor.addEventListener('click', () => input.focus());
  line.appendChild(echo); line.appendChild(cursor);
  output.appendChild(line);
  viewport.scrollTop = viewport.scrollHeight;
  return { line, echo, cursor };
}

let currentLine = null;

/* ──────────────────────────────────────────────────────────────────
   typeSequence — types text with per-character glitch
   (reduced: only ~9% chars get glitch-strong, base flicker slower)
────────────────────────────────────────────────────────────────── */
function typeSequence(str, done, speed) {
  const mult = speed !== undefined ? speed : 0.451562;
  // Below ~0.2 the 4ms browser minimum clamps all delays to the same value.
  // Instead we calculate how many chars to drop per 16ms rAF frame.
  const useRAF = mult < 0.2;
  const charsPerFrame = useRAF ? Math.max(1, Math.round(0.2 / mult)) : 1;

  const lines = str.split('\n');
  let lineIndex = 0;

  function typeLine() {
    if (lineIndex >= lines.length) {
      viewport.scrollTop = viewport.scrollHeight;
      done && done();
      return;
    }
    const lineDiv = document.createElement('div');
    output.appendChild(lineDiv);
    let i = 0;

    function tick() {
      const line = lines[lineIndex];
      // Drop charsPerFrame characters per tick
      for (let c = 0; c < charsPerFrame; c++) {
        if (i >= line.length) break;
        const span = document.createElement('span'); span.className = 'char-glitch';
        if (Math.random() < 0.09) span.classList.add('glitch-strong');
        span.textContent = line[i++];
        lineDiv.appendChild(span);
      }
      viewport.scrollTop = viewport.scrollHeight;

      if (i >= line.length) {
        output.appendChild(document.createElement('br'));
        lineIndex++;
        if (useRAF) requestAnimationFrame(typeLine);
        else setTimeout(typeLine, 0);
        return;
      }

      if (useRAF) requestAnimationFrame(tick);
      else {
        let delay = (10 + Math.random() * 40) * mult;
        if (line[i - 1] === ' ') delay *= 0.9;
        setTimeout(tick, delay);
      }
    }

    if (useRAF) requestAnimationFrame(tick);
    else tick();
  }
  typeLine();
}

/* appendStatic — adds non-typed output with CSS flicker on the block */
function appendStatic(html) {
  const d = document.createElement('div');
  d.className = 'output-static';
  d.innerHTML = html;
  output.appendChild(d);
  viewport.scrollTop = viewport.scrollHeight;
}

/* ──────────────────────────────────────────────────────────────────
   BOOT — intro types → waiting prompt → any input → memo types →
          command menu
────────────────────────────────────────────────────────────────── */

// Typewriter SFX — plays for 100ms at memo fire-up.
// Replace 'typewriter.mp3' with your actual file path/URL.
const TYPEWRITER_SFX = 'typewriter.mp3';

function playTypewriterSFX() {
  try {
    const sfx = new Audio(TYPEWRITER_SFX);
    sfx.volume = 0.7;
    sfx.play().catch(() => {});
    setTimeout(() => { sfx.pause(); sfx.currentTime = 0; }, 100);
  } catch(e) {}
}

function boot() {
  output.textContent = '';
  viewport.scrollTop = 0;
  currentLine = null;

  typeSequence(bootText, () => {
    // Show waiting prompt with a blinking block cursor instead of ellipsis
    const promptDiv = document.createElement('div');
    promptDiv.className = 'output-static';
    promptDiv.innerHTML = '\nPress any key or tap to continue\u00a0<span class="cursor"></span>\n';
    output.appendChild(promptDiv);
    viewport.scrollTop = viewport.scrollHeight;

    let triggered = false;
    function onAnyInput() {
      if (triggered) return;
      triggered = true;
      document.removeEventListener('keydown',    onAnyInput);
      document.removeEventListener('click',      onAnyInput);
      document.removeEventListener('touchstart', onAnyInput);
      // Remove the waiting prompt cursor cleanly
      promptDiv.remove();
      playTypewriterSFX();
      runMemo(() => {
        appendStatic(helpText + '\n');
        currentLine = createCmdLine();
        input.focus();
      });
    }
    document.addEventListener('keydown',    onAnyInput);
    document.addEventListener('click',      onAnyInput);
    document.addEventListener('touchstart', onAnyInput);
  }, 0.138671); // intro speed: 0.451562 * 0.75 = ~25% faster
}

boot();

/* ──────────────────────────────────────────────────────────────────
   BSOD
────────────────────────────────────────────────────────────────── */
function showTemporaryBSOD(duration = 2000, onDone) {
  if (bsodActive) return;
  bsodTempActive = true; bsod.style.display = 'block';
  bsod.textContent =
`*** STOP: 0x0000000A (0x00000000, 0x00000000, 0x00000000, 0x00000000)
IRQL_NOT_LESS_OR_EQUAL

*** Address 00000000 referenced memory at 00000000
The memory could not be written.
Collecting data for crash dump ...
Initializing disk for crash dump ...
`;
  const crtEl = document.querySelector('.crt');
  const flashes = Math.max(3, Math.floor(duration / 250));
  let count = 0;
  const interval = Math.floor(duration / flashes);
  const iv = setInterval(() => {
    crtEl.style.filter = (count % 2 === 0) ? 'brightness(.8)' : '';
    count++;
    if (count > flashes) {
      clearInterval(iv);
      bsod.style.display = 'none'; crtEl.style.filter = '';
      bsodTempActive = false; if (onDone) onDone();
    }
  }, interval);
}

/* ──────────────────────────────────────────────────────────────────
   MEMO — types inline like the intro, calls done() when finished
────────────────────────────────────────────────────────────────── */
function runMemo(done) {
  const fullText = '\n' + memoParagraphs.join('\n\n') + '\n\n' + memoSignoff + '\n';
  typeSequence(fullText, done, 0.06); // memo speed — tweak independently
}

/* ──────────────────────────────────────────────────────────────────
   NET command — retro table
────────────────────────────────────────────────────────────────── */
function runNet() {
  const wrap = document.createElement('div'); wrap.className = 'net-table-wrap';

  const table = document.createElement('table'); table.className = 'net-table';

  // header
  const thead = document.createElement('thead');
  const hrow  = document.createElement('tr');
  ['TERM','DEFINITION','CATEGORY'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; hrow.appendChild(th);
  });
  thead.appendChild(hrow); table.appendChild(thead);

  // body
  const tbody = document.createElement('tbody');
  netEntries.forEach((entry) => {
    const tr = document.createElement('tr'); tr.className = 'row-hidden';
    const tdT = document.createElement('td'); tdT.className = 'col-term'; tdT.textContent = entry.term;
    const tdD = document.createElement('td'); tdD.className = 'col-def';  tdD.textContent = entry.def;
    const tdC = document.createElement('td'); tdC.className = 'col-cat';  tdC.textContent = entry.cat;
    tr.appendChild(tdT); tr.appendChild(tdD); tr.appendChild(tdC);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  output.appendChild(wrap);

  // stagger rows in
  const rows = tbody.querySelectorAll('tr');
  rows.forEach((row, i) => {
    setTimeout(() => {
      row.classList.remove('row-hidden');
      row.classList.add('row-in');
      viewport.scrollTop = viewport.scrollHeight;
    }, i * 80); // 80ms per row
  });

  // show cursor after table loads
  const totalDelay = rows.length * 80 + 600;
  setTimeout(() => {
    currentLine = createCmdLine();
    input.focus();
  }, totalDelay);
}

/* ──────────────────────────────────────────────────────────────────
   INPUT HANDLING — free commands, original behaviour
────────────────────────────────────────────────────────────────── */
const responses = {
  status:`\neasterntravelerOS v1.4.2\nDeveloped by easterntraveler Systems, 1986-2026\nAll systems operational. Memory usage: 42%. Network: OK\n`
};

input.addEventListener('input', () => {
  currentLine.echo.textContent = '> ' + input.value;
  viewport.scrollTop = viewport.scrollHeight;
});

input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const raw = input.value || '';
  const cmd = raw.trim().toLowerCase();
  currentLine.echo.textContent = '> ' + raw;
  currentLine.line.removeChild(currentLine.cursor);
  viewport.scrollTop = viewport.scrollHeight;
  input.value = '';

  if (!cmd) { currentLine = createCmdLine(); return; }

  if (cmd === 'help') {
    appendStatic(helpText);
    currentLine = createCmdLine();
    return;
  }

  if (cmd === 'cache') {
    showTemporaryBSOD(2200, () => { currentLine = createCmdLine(); });
    return;
  }

  if (cmd === 'memo') {
    runMemo(() => { currentLine = createCmdLine(); input.focus(); });
    return;
  }

  if (cmd === 'net') {
    runNet();
    return;
  }

  if (responses[cmd]) {
    appendStatic(responses[cmd]);
    currentLine = createCmdLine();
    return;
  }

  appendStatic(`\nUnknown command. Type 'help' for options.\n`);
  currentLine = createCmdLine();
  viewport.scrollTop = viewport.scrollHeight;
});
</script>
</body>
</html>
